<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DorkyLeaks — Custom Scan</title>
  <style>
    :root {
      --bg: #07090d;
      --bg-2: #0d1117;
      --panel: rgba(17, 20, 24, 0.94);
      --panel-alt: rgba(12, 15, 18, 0.9);
      --border: rgba(148, 163, 184, 0.18);
      --text: #edf3ff;
      --muted: #a9b7c8;
      --soft: #dfe8f5;
      --good: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
      --pri: #8b5cf6;
      --pri-2: #c084fc;
      --cyan: #22d3ee;
      --shadow: rgba(0, 0, 0, 0.38);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(139, 92, 246, 0.25), transparent 26%),
        radial-gradient(circle at top right, rgba(34, 211, 238, 0.14), transparent 28%),
        linear-gradient(180deg, #07090d 0%, #0e1116 100%);
      color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 28px 16px 72px;
    }

    .app {
      width: min(1100px, 100%);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 3vw, 3rem);
      letter-spacing: -0.08em;
      font-weight: 800;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .live-indicator .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--good);
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.8);
      display: inline-block;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 18px 35px var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      padding: 18px 18px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.08rem;
      letter-spacing: -0.04em;
    }

    .panel-body {
      padding: 18px;
    }

    .statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      font-size: 12px;
    }

    .progress-wrap {
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.04);
      display: none;
    }

    .progress-wrap.show { display: block; }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--pri), var(--cyan), var(--good));
      border-radius: inherit;
      transition: width 0.25s ease;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 10px;
      min-height: 88px;
    }

    .metric small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .metric strong {
      display: block;
      font-size: 1.8rem;
      letter-spacing: -0.08em;
      line-height: 1;
    }

    .metric.good strong { color: var(--good); }
    .metric.warn strong { color: var(--warn); }
    .metric.bad strong { color: var(--bad); }
    .metric.neutral strong { color: var(--soft); }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .field label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input, select, textarea, button {
      font: inherit;
    }

    input, select, textarea {
      width: 100%;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(196, 132, 252, 0.9);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.14);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 14px;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px) scale(0.99); }

    button.primary {
      background: linear-gradient(135deg, var(--pri-2), var(--pri));
      border-color: rgba(192,132,252,0.72);
      box-shadow: 0 12px 20px rgba(139, 92, 246, 0.24);
      color: white;
    }

    button.warn {
      border-color: rgba(251,191,36,0.42);
      color: var(--warn);
    }

    button.danger {
      border-color: rgba(248,113,113,0.42);
      color: var(--bad);
    }

    .summary {
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      font-size: 13px;
    }

    .summary strong {
      color: var(--text);
      font-weight: 800;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toolbar select, .toolbar input {
      width: auto;
      min-width: 140px;
      background: rgba(255,255,255,0.02);
    }

    .results {
      display: grid;
      gap: 12px;
    }

    .result-item {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .result-url {
      font-weight: 700;
      letter-spacing: -0.03em;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      border: 1px solid transparent;
    }

    .status-pill.ok {
      background: rgba(52, 211, 153, 0.12);
      border-color: rgba(52, 211, 153, 0.48);
      color: var(--good);
    }

    .status-pill.warn {
      background: rgba(251, 191, 36, 0.12);
      border-color: rgba(251, 191, 36, 0.45);
      color: var(--warn);
    }

    .status-pill.bad {
      background: rgba(248, 113, 113, 0.12);
      border-color: rgba(248, 113, 113, 0.45);
      color: var(--bad);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .snippet {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      font: 12px/1.6 "SFMono-Regular", Consolas, monospace;
      color: var(--soft);
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 28px 20px;
      background: rgba(255,255,255,0.01);
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .split { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .header-right { justify-content: flex-start; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      .metrics { grid-template-columns: 1fr; }
      .results-header { align-items: flex-start; }
      .toolbar { width: 100%; }
      .toolbar > * { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>DorkyLeaks</h1>
      <div class="header-right">
        <span class="live-indicator"><span class="dot"></span> live</span>
      </div>
    </header>

    <div class="layout">
      <section class="panel">
        <div class="panel-header">
          <h2>Scan configuration</h2>
        </div>
        <div class="panel-body">
          <div class="statusbar">
            <span id="scanStateText">Idle</span>
            <span id="scanCountdown">0/0 queued</span>
          </div>

          <div id="progressWrap" class="progress-wrap show">
            <div id="progressBar" class="progress-bar"></div>
          </div>

          <div class="metrics">
            <div class="metric neutral">
              <small>Queued</small>
              <strong id="metricQueued">0</strong>
            </div>
            <div class="metric good">
              <small>Healthy</small>
              <strong id="metricGood">0</strong>
            </div>
            <div class="metric warn">
              <small>Warn</small>
              <strong id="metricWarn">0</strong>
            </div>
            <div class="metric bad">
              <small>Errors</small>
              <strong id="metricBad">0</strong>
            </div>
          </div>

          <div class="field">
            <label for="customUrls">Target URLs</label>
            <textarea id="customUrls" spellcheck="false" placeholder="https://example.com&#10;https://shop.example.com&#10;https://api.example.com"></textarea>
          </div>

          <div class="split">
            <div class="field">
              <label for="apiMode">API key mode</label>
              <select id="apiMode">
                <option value="none">No API key</option>
                <option value="bearer">Bearer token</option>
                <option value="custom">Custom header</option>
              </select>
            </div>

            <div class="field">
              <label for="apiKey">API key / token</label>
              <input id="apiKey" type="password" placeholder="Paste API key here" />
            </div>
          </div>

          <div class="field">
            <label for="headerName">Header name</label>
            <input id="headerName" type="text" value="X-API-Key" placeholder="X-API-Key" />
          </div>

          <div class="field">
            <label for="customQuery">Optional scan notes / query</label>
            <input id="customQuery" type="text" placeholder="Example: checkout auth, admin, config, secrets" />
          </div>

          <div class="actions">
            <button id="parseUrls" type="button">Parse URLs</button>
            <button id="runCustomScan" class="primary" type="button">Run custom scan</button>
            <button id="clearScan" class="danger" type="button">Clear</button>
          </div>

          <div id="scanSummary" class="summary"><strong>0</strong> valid URLs queued</div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Settings</h2>
        </div>
        <div class="panel-body">
          <div class="field">
            <label for="timeoutMs">Timeout (ms)</label>
            <input id="timeoutMs" type="number" min="2000" max="60000" step="1000" value="15000" />
          </div>

          <div class="field">
            <label for="concurrency">Concurrency</label>
            <input id="concurrency" type="number" min="1" max="20" step="1" value="4" />
          </div>

          <div class="field">
            <label for="extraHeaders">Extra headers (JSON)</label>
            <textarea id="extraHeaders" spellcheck="false">{"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36","Accept":"text/html,application/json;q=0.9,*/*;q=0.8"}</textarea>
          </div>

          <div class="actions">
            <button id="saveSettings" class="primary" type="button">Save settings</button>
            <button id="resetSettings" type="button">Reset defaults</button>
          </div>
        </div>
      </section>
    </div>

    <section class="panel">
      <div class="panel-header">
        <h2>Results</h2>
      </div>
      <div class="panel-body">
        <div class="results-header">
          <div class="muted">Live output</div>
          <div class="toolbar">
            <select id="resultFilter">
              <option value="all">All results</option>
              <option value="ok">Healthy only</option>
              <option value="warn">Warnings</option>
              <option value="bad">Errors</option>
            </select>
            <input id="resultSearch" type="text" placeholder="Filter by URL" />
          </div>
        </div>

        <div id="results" class="results">
          <div class="empty">No scan results yet. Add URLs and run a custom scan.</div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'dorkyleaks.settings.v1';

    const DEFAULTS = {
      timeoutMs: 15000,
      concurrency: 4,
      apiMode: 'none',
      apiKey: '',
      headerName: 'X-API-Key',
      extraHeaders: {
        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
        Accept: 'text/html,application/json;q=0.9,*/*;q=0.8'
      },
      customQuery: ''
    };

    const state = {
      results: [],
      scanning: false,
      progress: 0,
      queuedTotal: 0
    };

    const el = {
      customUrls: document.getElementById('customUrls'),
      apiMode: document.getElementById('apiMode'),
      apiKey: document.getElementById('apiKey'),
      headerName: document.getElementById('headerName'),
      customQuery: document.getElementById('customQuery'),
      scanSummary: document.getElementById('scanSummary'),
      scanStateText: document.getElementById('scanStateText'),
      scanCountdown: document.getElementById('scanCountdown'),
      timeoutMs: document.getElementById('timeoutMs'),
      concurrency: document.getElementById('concurrency'),
      extraHeaders: document.getElementById('extraHeaders'),
      results: document.getElementById('results'),
      resultFilter: document.getElementById('resultFilter'),
      resultSearch: document.getElementById('resultSearch'),
      progressWrap: document.getElementById('progressWrap'),
      progressBar: document.getElementById('progressBar'),
      metricQueued: document.getElementById('metricQueued'),
      metricGood: document.getElementById('metricGood'),
      metricWarn: document.getElementById('metricWarn'),
      metricBad: document.getElementById('metricBad')
    };

    function safeJsonParse(raw, fallback) {
      try {
        return JSON.parse(raw || '{}');
      } catch {
        return fallback;
      }
    }

    function normalizeApiKey(value) {
      return String(value || '').trim();
    }

    function getSettings() {
      const saved = safeJsonParse(localStorage.getItem(STORAGE_KEY), {});
      return {
        ...DEFAULTS,
        ...saved,
        extraHeaders: { ...DEFAULTS.extraHeaders, ...(saved.extraHeaders || {}) }
      };
    }

    function saveSettings() {
      const payload = {
        timeoutMs: Number(el.timeoutMs.value || DEFAULTS.timeoutMs),
        concurrency: Number(el.concurrency.value || DEFAULTS.concurrency),
        apiMode: el.apiMode.value,
        apiKey: normalizeApiKey(el.apiKey.value),
        headerName: (el.headerName.value || 'X-API-Key').trim(),
        extraHeaders: safeJsonParse(el.extraHeaders.value, DEFAULTS.extraHeaders),
        customQuery: el.customQuery.value.trim()
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      return payload;
    }

    function hydrateSettings() {
      const settings = getSettings();
      el.timeoutMs.value = settings.timeoutMs;
      el.concurrency.value = settings.concurrency;
      el.apiMode.value = settings.apiMode;
      el.apiKey.value = settings.apiKey;
      el.headerName.value = settings.headerName;
      el.customQuery.value = settings.customQuery;
      el.extraHeaders.value = JSON.stringify(settings.extraHeaders, null, 2);
    }

    function parseCustomUrls(raw) {
      const items = String(raw || '')
        .split(/\r?\n|,/) 
        .map(x => x.trim())
        .filter(Boolean)
        .filter((value, index, arr) => arr.indexOf(value) === index);

      const valid = [];
      const invalid = [];

      for (const item of items) {
        try {
          const url = new URL(item);
          if (['http:', 'https:'].includes(url.protocol)) {
            valid.push(url.toString());
          } else {
            invalid.push(item);
          }
        } catch {
          invalid.push(item);
        }
      }

      return { valid, invalid, total: valid.length };
    }

    function updateSummary(raw) {
      const parsed = parseCustomUrls(raw);
      state.queuedTotal = parsed.total;
      el.scanSummary.innerHTML = `<strong>${parsed.total}</strong> valid URL${parsed.total === 1 ? '' : 's'} queued`;
      if (parsed.invalid.length) {
        el.scanSummary.innerHTML += ` · ${parsed.invalid.length} invalid ignored`;
      }
      renderMetrics();
    }

    function renderMetrics() {
      const all = state.results.length;
      const good = state.results.filter(r => r.ok).length;
      const warn = state.results.filter(r => !r.ok && r.status && r.status < 500 && r.status !== 0).length;
      const bad = state.results.filter(r => !r.ok && (r.status >= 500 || r.status === 0)).length;

      el.metricQueued.textContent = String(state.queuedTotal || all || 0);
      el.metricGood.textContent = String(good);
      el.metricWarn.textContent = String(warn);
      el.metricBad.textContent = String(bad);
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getFilteredResults() {
      const filter = el.resultFilter.value;
      const search = (el.resultSearch.value || '').trim().toLowerCase();

      return state.results.filter(result => {
        const type = result.ok ? 'ok' : (result.status >= 500 || result.status === 0 ? 'bad' : 'warn');
        const matchFilter = filter === 'all' || filter === type;
        const matchSearch = !search || (result.url || '').toLowerCase().includes(search);
        return matchFilter && matchSearch;
      });
    }

    function renderResults() {
      const items = getFilteredResults();

      if (!items.length) {
        el.results.innerHTML = '<div class="empty">No results match the active filter.</div>';
        return;
      }

      el.results.innerHTML = items
        .slice()
        .reverse()
        .map(result => {
          const klass = result.ok ? 'ok' : (result.status >= 500 || result.status === 0 ? 'bad' : 'warn');
          const label = result.ok ? 'OK' : (result.status >= 500 || result.status === 0 ? 'ERR' : 'WARN');
          const snippet = (result.snippet || '').replace(/\s+/g, ' ').trim();

          return `
            <div class="result-item">
              <div class="result-head">
                <div class="result-url">${escapeHtml(result.url)}</div>
                <span class="status-pill ${klass}">${label}</span>
              </div>
              <div class="meta">
                <span>Status: ${result.status || 'N/A'}</span>
                <span>Latency: ${result.latency || 0} ms</span>
                <span>Mode: ${result.mode || 'direct'}</span>
              </div>
              <pre class="snippet">${escapeHtml(snippet || 'No response content captured.')}</pre>
            </div>
          `;
        })
        .join('');
    }

    function ctpto(config = {}) {
      const { apiMode = 'none', apiKey = '', headerName = 'X-API-Key', extraHeaders = {} } = config;
      const auth = {};

      if (apiMode === 'bearer' && apiKey) {
        auth.Authorization = `Bearer ${apiKey}`;
      }

      if (apiMode === 'custom' && apiKey && headerName) {
        auth[headerName] = apiKey;
      }

      return {
        headers: {
          ...extraHeaders,
          ...auth
        },
        mode: apiMode
      };
    }

    function updateScanState(text, current, total) {
      el.scanStateText.textContent = text;
      el.scanCountdown.textContent = current + '/' + total + ' queued';
      el.progressWrap.classList.toggle('show', total > 0 && state.scanning);
      const percent = total ? Math.min(100, (current / total) * 100) : 0;
      el.progressBar.style.width = percent + '%';
    }

    async function probeUrl(url, settings) {
      const startedAt = performance.now();
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), settings.timeoutMs);

      try {
        const response = await fetch(url, {
          method: 'GET',
          headers: ctpto(settings).headers,
          signal: controller.signal,
          mode: 'cors',
          credentials: 'omit'
        });

        const text = await response.text();
        const latency = Math.round(performance.now() - startedAt);
        const snippet = text.slice(0, 500);

        return {
          url,
          ok: response.ok,
          status: response.status,
          latency,
          snippet: snippet || `HTTP ${response.status} ${response.statusText}`,
          mode: settings.apiMode
        };
      } catch (error) {
        const latency = Math.round(performance.now() - startedAt);
        return {
          url,
          ok: false,
          status: 0,
          latency,
          snippet: String(error && error.message ? error.message : error),
          mode: settings.apiMode
        };
      } finally {
        clearTimeout(timeout);
      }
    }

    async function runCustomScan() {
      const settings = saveSettings();
      const parsed = parseCustomUrls(el.customUrls.value);
      if (!parsed.valid.length) {
        state.results = [{
          url: 'no valid URLs',
          ok: false,
          status: 0,
          latency: 0,
          snippet: 'No valid URL entries were found. Use one URL per line or comma-separated values.',
          mode: settings.apiMode
        }];
        state.scanning = false;
        renderResults();
        renderMetrics();
        updateScanState('Idle', 0, 0);
        return;
      }

      state.scanning = true;
      state.results = [];
      renderResults();
      updateScanState('Scanning', 0, parsed.valid.length);
      renderMetrics();

      const limit = Number(settings.concurrency || 4);
      const queue = parsed.valid.slice(0, 200);
      const results = [];

      for (let i = 0; i < queue.length; i += limit) {
        const batch = queue.slice(i, i + limit);
        const batchResults = await Promise.all(batch.map(url => probeUrl(url, settings)));
        results.push(...batchResults);
        state.progress = results.length;
        updateScanState('Scanning', results.length, queue.length);
        state.results = results;
        renderResults();
        renderMetrics();
      }

      state.scanning = false;
      updateScanState('Complete', queue.length, queue.length);
      renderResults();
      renderMetrics();
    }

    document.getElementById('parseUrls').addEventListener('click', () => {
      updateSummary(el.customUrls.value);
    });

    document.getElementById('clearScan').addEventListener('click', () => {
      el.customUrls.value = '';
      el.customQuery.value = '';
      el.apiKey.value = '';
      state.results = [];
      state.scanning = false;
      updateSummary('');
      renderResults();
      renderMetrics();
      updateScanState('Idle', 0, 0);
    });

    document.getElementById('runCustomScan').addEventListener('click', runCustomScan);

    document.getElementById('saveSettings').addEventListener('click', () => {
      const settings = saveSettings();
      updateSummary(el.customUrls.value);
      state.results = [{
        url: 'settings saved',
        ok: true,
        status: 200,
        latency: 0,
        snippet: `Settings updated for timeout=${settings.timeoutMs}ms, concurrency=${settings.concurrency}, API mode=${settings.apiMode || 'none'}.`,
        mode: settings.apiMode
      }, ...state.results].slice(0, 3);
      renderResults();
      renderMetrics();
    });

    document.getElementById('resetSettings').addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      hydrateSettings();
      updateSummary(el.customUrls.value);
    });

    el.customUrls.addEventListener('input', () => updateSummary(el.customUrls.value));
    el.resultFilter.addEventListener('change', renderResults);
    el.resultSearch.addEventListener('input', renderResults);

    hydrateSettings();
    updateSummary(el.customUrls.value);
    renderMetrics();
    updateScanState('Idle', 0, 0);
  </script>
</body>
</html>
