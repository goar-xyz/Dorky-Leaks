<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DorkyLeaks — Custom Scan</title>
  <style>
    :root {
      --bg: #09090b;
      --panel: rgba(17, 18, 20, 0.96);
      --panel-2: #15171b;
      --border: #2b3037;
      --text: #f3f6fb;
      --muted: #a6afba;
      --good: #2dd4bf;
      --warn: #fbbf24;
      --bad: #f87171;
      --pri: #8b5cf6;
      --pri-2: #c084fc;
      --shadow: rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(139,92,246,.22), transparent 28%),
        linear-gradient(180deg, #09090b 0%, #121417 35%, #09090b 100%);
      color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 32px 16px 64px;
    }

    .app {
      width: min(1040px, 100%);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 2.8rem);
      letter-spacing: -0.06em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 16px 32px var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      padding: 18px 18px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.08rem;
      letter-spacing: -0.03em;
    }

    .panel-body {
      padding: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input, select, textarea, button {
      font: inherit;
    }

    input, select, textarea {
      width: 100%;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(139, 92, 246, 0.8);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.14);
    }

    textarea {
      min-height: 170px;
      resize: vertical;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 14px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    button {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.2s ease, border-color 0.2s ease;
    }

    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(1px) scale(0.99); }

    button.primary {
      background: linear-gradient(135deg, var(--pri-2), var(--pri));
      border-color: rgba(192,132,252,0.7);
      color: #fff;
      box-shadow: 0 10px 18px rgba(139,92,246,0.28);
    }

    button.warn {
      border-color: rgba(251,191,36,0.45);
      color: var(--warn);
    }

    button.danger {
      border-color: rgba(248,113,113,0.45);
      color: var(--bad);
    }

    .summary {
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      font-size: 13px;
    }

    .summary strong {
      color: var(--text);
    }

    .results {
      display: grid;
      gap: 12px;
    }

    .result-item {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .result-url {
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .status-pill {
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .status-pill.ok {
      background: rgba(45,212,191,0.12);
      border-color: rgba(45,212,191,0.45);
      color: var(--good);
    }

    .status-pill.warn {
      background: rgba(251,191,36,0.12);
      border-color: rgba(251,191,36,0.45);
      color: var(--warn);
    }

    .status-pill.bad {
      background: rgba(248,113,113,0.12);
      border-color: rgba(248,113,113,0.45);
      color: var(--bad);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .snippet {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      font: 12px/1.6 "SFMono-Regular", Consolas, monospace;
      color: #dfe7f3;
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 28px 20px;
      background: rgba(255,255,255,0.01);
    }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .split { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>DorkyLeaks</h1>
      <span class="badge">Custom Scan</span>
    </header>

    <div class="layout">
      <section class="panel">
        <div class="panel-header">
          <h2>Scan configuration</h2>
        </div>
        <div class="panel-body">
          <div class="field">
            <label for="customUrls">Target URLs</label>
            <textarea id="customUrls" spellcheck="false" placeholder="https://example.com&#10;https://shop.example.com&#10;https://api.example.com"></textarea>
          </div>

          <div class="split">
            <div class="field">
              <label for="apiMode">API key mode</label>
              <select id="apiMode">
                <option value="none">No API key</option>
                <option value="bearer">Bearer token</option>
                <option value="custom">Custom header</option>
              </select>
            </div>

            <div class="field">
              <label for="apiKey">API key / token</label>
              <input id="apiKey" type="password" placeholder="Paste API key here" />
            </div>
          </div>

          <div class="field">
            <label for="headerName">Header name</label>
            <input id="headerName" type="text" value="X-API-Key" placeholder="X-API-Key" />
          </div>

          <div class="field">
            <label for="customQuery">Optional scan notes / query</label>
            <input id="customQuery" type="text" placeholder="Example: auth, admin, config, secrets" />
          </div>

          <div class="actions">
            <button id="parseUrls" type="button">Parse URLs</button>
            <button id="runCustomScan" class="primary" type="button">Run custom scan</button>
            <button id="clearScan" class="danger" type="button">Clear</button>
          </div>

          <div id="scanSummary" class="summary"><strong>0</strong> URLs queued</div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Settings</h2>
        </div>
        <div class="panel-body">
          <div class="field">
            <label for="timeoutMs">Timeout (ms)</label>
            <input id="timeoutMs" type="number" min="2000" max="60000" step="1000" value="15000" />
          </div>

          <div class="field">
            <label for="concurrency">Concurrency</label>
            <input id="concurrency" type="number" min="1" max="20" step="1" value="4" />
          </div>

          <div class="field">
            <label for="extraHeaders">Extra headers (JSON)</label>
            <textarea id="extraHeaders" spellcheck="false">{
  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
  "Accept": "text/html,application/json;q=0.9,*/*;q=0.8"
}</textarea>
          </div>

          <div class="actions">
            <button id="saveSettings" class="primary" type="button">Save settings</button>
            <button id="resetSettings" type="button">Reset defaults</button>
          </div>
        </div>
      </section>
    </div>

    <section class="panel" style="margin-top:18px;">
      <div class="panel-header">
        <h2>Results</h2>
      </div>
      <div class="panel-body">
        <div id="results" class="results">
          <div class="empty">No scan results yet. Add URLs and run a custom scan.</div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'dorkyleaks.settings.v1';

    const DEFAULTS = {
      timeoutMs: 15000,
      concurrency: 4,
      apiMode: 'none',
      apiKey: '',
      headerName: 'X-API-Key',
      customQuery: '',
      extraHeaders: {
        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
        Accept: 'text/html,application/json;q=0.9,*/*;q=0.8'
      }
    };

    const state = {
      results: []
    };

    const el = {
      customUrls: document.getElementById('customUrls'),
      apiMode: document.getElementById('apiMode'),
      apiKey: document.getElementById('apiKey'),
      headerName: document.getElementById('headerName'),
      customQuery: document.getElementById('customQuery'),
      scanSummary: document.getElementById('scanSummary'),
      timeoutMs: document.getElementById('timeoutMs'),
      concurrency: document.getElementById('concurrency'),
      extraHeaders: document.getElementById('extraHeaders'),
      results: document.getElementById('results')
    };

    function safeJsonParse(value, fallback) {
      try {
        const raw = value == null ? '{}' : value;
        return JSON.parse(raw || '{}');
      } catch {
        return fallback;
      }
    }

    function normalizeApiKey(value) {
      return String(value || '').trim();
    }

    function getSettings() {
      const saved = safeJsonParse(localStorage.getItem(STORAGE_KEY), {});
      return {
        ...DEFAULTS,
        ...saved,
        extraHeaders: { ...DEFAULTS.extraHeaders, ...(saved.extraHeaders || {}) }
      };
    }

    function hydrateSettings() {
      const settings = getSettings();
      el.timeoutMs.value = settings.timeoutMs;
      el.concurrency.value = settings.concurrency;
      el.apiMode.value = settings.apiMode || 'none';
      el.apiKey.value = settings.apiKey || '';
      el.headerName.value = settings.headerName || 'X-API-Key';
      el.customQuery.value = settings.customQuery || '';
      el.extraHeaders.value = JSON.stringify(settings.extraHeaders, null, 2);
    }

    function saveSettings() {
      const payload = {
        timeoutMs: Number(el.timeoutMs.value || DEFAULTS.timeoutMs),
        concurrency: Number(el.concurrency.value || DEFAULTS.concurrency),
        apiMode: el.apiMode.value || 'none',
        apiKey: normalizeApiKey(el.apiKey.value),
        headerName: (el.headerName.value || 'X-API-Key').trim(),
        customQuery: String(el.customQuery.value || '').trim(),
        extraHeaders: safeJsonParse(el.extraHeaders.value, DEFAULTS.extraHeaders)
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      return payload;
    }

    function parseCustomUrls(raw) {
      const list = String(raw || '')
        .split(/\r?\n|,/) 
        .map(s => s.trim())
        .filter(Boolean)
        .filter((value, index, arr) => arr.indexOf(value) === index);

      const valid = [];
      const invalid = [];

      for (const item of list) {
        try {
          const url = new URL(item);
          if (['http:', 'https:'].includes(url.protocol)) {
            valid.push(url.toString());
          } else {
            invalid.push(item);
          }
        } catch {
          invalid.push(item);
        }
      }

      return { valid, invalid, total: valid.length };
    }

    function updateSummary(raw) {
      const parsed = parseCustomUrls(raw);
      let text = `<strong>${parsed.total}</strong> valid URL${parsed.total === 1 ? '' : 's'} queued`;
      if (parsed.invalid.length) text += ` · ${parsed.invalid.length} invalid ignored`;
      el.scanSummary.innerHTML = text;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function buildAuthHeaders(config) {
      const {
        apiMode = 'none',
        apiKey = '',
        headerName = 'X-API-Key',
        extraHeaders = {}
      } = config;

      const headers = { ...extraHeaders };
      const key = String(headerName || 'X-API-Key').trim();
      const token = normalizeApiKey(apiKey);

      if (apiMode === 'bearer' && token) {
        headers.Authorization = `Bearer ${token}`;
      } else if (apiMode === 'custom' && token && key) {
        headers[key] = token;
      }

      return headers;
    }

    function renderResults() {
      if (!state.results.length) {
        el.results.innerHTML = '<div class="empty">No scan results yet. Add URLs and run a custom scan.</div>';
        return;
      }

      const html = state.results
        .slice()
        .reverse()
        .map(result => {
          const status = result.ok ? 'ok' : result.status >= 400 ? 'bad' : 'warn';
          const label = result.ok ? 'OK' : result.status >= 400 ? 'ERR' : 'WARN';
          const snippet = (result.snippet || '').replace(/\s+/g, ' ').trim();
          return `
            <div class="result-item">
              <div class="result-head">
                <div class="result-url">${escapeHtml(result.url)}</div>
                <span class="status-pill ${status}">${label}</span>
              </div>
              <div class="meta">
                <span>Status: ${result.status ?? 'N/A'}</span>
                <span>Latency: ${result.latency ?? 0} ms</span>
                <span>Mode: ${escapeHtml(result.mode || 'direct')}</span>
              </div>
              <pre class="snippet">${escapeHtml(snippet || 'No response content captured.')}</pre>
            </div>
          `;
        })
        .join('');

      el.results.innerHTML = html;
    }

    async function probeUrl(url, settings) {
      const started = performance.now();
      const controller = new AbortController();
      const timeoutMs = Number(settings.timeoutMs || DEFAULTS.timeoutMs);
      const timeout = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const requestHeaders = buildAuthHeaders(settings);
        const response = await fetch(url, {
          method: 'GET',
          headers: requestHeaders,
          signal: controller.signal,
          mode: 'cors',
          credentials: 'omit'
        });

        const text = await response.text();
        const latency = Math.round(performance.now() - started);
        const snippet = text.slice(0, 500);

        return {
          url,
          ok: response.ok,
          status: response.status,
          latency,
          snippet: snippet || `HTTP ${response.status} ${response.statusText}`,
          mode: settings.apiMode || 'none'
        };
      } catch (error) {
        return {
          url,
          ok: false,
          status: 0,
          latency: Math.round(performance.now() - started),
          snippet: String(error && error.message ? error.message : error),
          mode: settings.apiMode || 'none'
        };
      } finally {
        clearTimeout(timeout);
      }
    }

    async function runCustomScan() {
      const settings = saveSettings();
      const parsed = parseCustomUrls(el.customUrls.value);

      if (!parsed.valid.length) {
        state.results = [{
          url: 'No valid URLs',
          ok: false,
          status: 0,
          latency: 0,
          snippet: 'No valid URL entries were found. Use one URL per line or comma-separated values.',
          mode: settings.apiMode || 'none'
        }];
        renderResults();
        return;
      }

      const maxConcurrency = Math.max(1, Number(settings.concurrency || 4));
      const queue = parsed.valid.slice(0, 200);
      const results = [];

      for (let i = 0; i < queue.length; i += maxConcurrency) {
        const batch = queue.slice(i, i + maxConcurrency);
        const batchResults = await Promise.allSettled(batch.map(url => probeUrl(url, settings)));
        for (const item of batchResults) {
          results.push(item.status === 'fulfilled' ? item.value : {
            url: 'batch failure',
            ok: false,
            status: 0,
            latency: 0,
            snippet: item.reason ? String(item.reason) : 'Probe failed',
            mode: settings.apiMode || 'none'
          });
        }
      }

      state.results = results;
      renderResults();
    }

    document.getElementById('parseUrls').addEventListener('click', () => updateSummary(el.customUrls.value));
    document.getElementById('runCustomScan').addEventListener('click', runCustomScan);
    document.getElementById('clearScan').addEventListener('click', () => {
      el.customUrls.value = '';
      el.customQuery.value = '';
      el.apiKey.value = '';
      state.results = [];
      updateSummary('');
      renderResults();
    });

    document.getElementById('saveSettings').addEventListener('click', () => {
      const settings = saveSettings();
      updateSummary(el.customUrls.value);
      state.results = [{
        url: 'settings saved',
        ok: true,
        status: 200,
        latency: 0,
        snippet: `Settings updated for timeout=${settings.timeoutMs}ms, concurrency=${settings.concurrency}, API mode=${settings.apiMode || 'none'}.`,
        mode: settings.apiMode || 'none'
      }, ...state.results].slice(0, 3);
      renderResults();
    });

    document.getElementById('resetSettings').addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      hydrateSettings();
      updateSummary(el.customUrls.value);
    });

    el.customUrls.addEventListener('input', () => updateSummary(el.customUrls.value));
    hydrateSettings();
    updateSummary(el.customUrls.value);
  </script>
</body>
</html>
